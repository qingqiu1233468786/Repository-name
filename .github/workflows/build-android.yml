name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Flutter 3.47.6（固定版本，和报错日志保持一致）
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.6'
          cache: true

      - name: 修改SDK版本 + 挖孔屏适配（移除flutter create，不再重生成android文件夹）
        run: |
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} \;
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} \;
          find android/ -name "build.gradle*" -exec sed -i 's/targetSdk = .*/targetSdk = 36/g' {} \;
          find android/ -name "build.gradle*" -exec sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' {} \;
          sed -i 's/<application /<application android:windowLayoutInDisplayCutoutMode="shortEdges" /g' android/app/src/main/AndroidManifest.xml

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
