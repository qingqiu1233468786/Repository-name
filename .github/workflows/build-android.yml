name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.6'
          cache: true

      # 1. 删掉仓库里所有旧的 Android 构建残留（防止旧配置干扰新版 Flutter）
      - name: 清理旧 Android 配置
        run: rm -rf android

      # 2. 重新生成一整套适配 Flutter 3.47.6 的现代 Android 项目
      - name: 纯净重建 Android 项目
        run: flutter create --platforms=android --org com.qingqiu --project-name tool1 .

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk