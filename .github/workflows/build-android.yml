name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: 创建全新Flutter项目并打包
        run: |
          flutter create -t app new_app
          cp -r lib new_app/
          cp pubspec.yaml new_app/
          if [ -d assets ]; then cp -r assets new_app/; fi
          if [ -d android/app/src/main/res ]; then cp -r android/app/src/main/res new_app/android/app/src/main/; fi
          cd new_app
          flutter pub get
          flutter build apk --release

      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: app-release安装包
          path: new_app/build/app/outputs/apk/release/app-release.apk
