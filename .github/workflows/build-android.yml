name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Flutter 3.32.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: 自动补全 Android 目录并修改 SDK 版本
        run: |
          flutter create --platforms=android --org com.sanqing --project-name sanqing .
          
          # 兼容新版 Flutter 生成的 gradle 和 gradle.kts 文件
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk .*/compileSdk 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle
            sed -i 's/targetSdk .*/targetSdk 34/g' android/app/build.gradle
          fi
          
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle.kts
          fi
          
          # 挖孔屏适配
          sed -i 's/<application /<application android:windowLayoutInDisplayCutoutMode="shortEdges" /g' android/app/src/main/AndroidManifest.xml

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk