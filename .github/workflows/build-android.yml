name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置最新版 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 自动补全 Android 目录并强制修改 SDK 版本与挖孔屏适配
        run: |
          flutter create --platforms=android --org com.sanqing --project-name sanqing .
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} \;
          find android/ -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} \;
          find android/ -name "build.gradle*" -exec sed -i 's/targetSdk = .*/targetSdk = 36/g' {} \;
          find android/ -name "build.gradle*" -exec sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' {} \;
          sed -i 's/<application /<application android:windowLayoutInDisplayCutoutMode="shortEdges" /g' android/app/src/main/AndroidManifest.xml

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk